name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: vx cargo +1.95.0 fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: vx cargo +1.95.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: vx cargo +1.95.0 test --workspace --all-targets --locked
      - run: vx cargo +1.95.0 test --workspace --all-targets --all-features --locked
      # --all-targets does not cover doctests, which are the only place the
      # public API is compiled from outside the crate. Without this lane a
      # broken example in a doc comment ships green.
      - run: vx cargo +1.95.0 test --workspace --doc --all-features --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: vx cargo +1.95.0 doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: vx cargo +1.95.0 package --locked

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    # `cargo publish --dry-run` verifies what `cargo package` cannot: that the
    # crate resolves and builds the way it would as a published registry
    # dependency, with no path-only or git-only files available. Running it on
    # every push is wasteful, so it is scoped to the commits that precede a
    # release -- tags and main.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify the crate publishes
        # No registry token: --dry-run never contacts crates.io to upload, and
        # it must stay that way -- a real publish is a gated action.
        run: vx cargo +1.95.0 publish --dry-run --locked
