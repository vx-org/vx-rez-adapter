[package]
name = "vx-rez-adapter"
version = "0.1.1"
edition = "2024"
rust-version = "1.95.0"
authors = ["LongHao <hal.long@outlook.com>"]
description = "Rust adapter integrating vx with rez-next package environments"
license = "Apache-2.0"
repository = "https://github.com/vx-org/vx-rez-adapter"
documentation = "https://docs.rs/vx-rez-adapter"
readme = "README.md"
keywords = ["rez", "rez-next", "vx", "package-manager", "environment"]
categories = ["development-tools"]

[dependencies]
rez-next-runtime = "=0.3.10"
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[dev-dependencies]
rstest = "0.27"
tempfile = "3"

[[example]]
name = "resolve_and_launch"
path = "examples/resolve_and_launch.rs"
